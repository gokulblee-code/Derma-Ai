<style>
  :root {
    --primary-dark: #213321;
    --primary: #2f4d2f;
    --secondary: #517b4e;
    --accent: #789c74;
    --background: #e3ebe0;
    --card-bg: #ffffff;
    --text-primary: #213321;
    --text-secondary: #3c603b;
    --btn-bg: #517b4e;
    --btn-hover: #3c603b;
  }

  body {
    background: var(--background);
    color: var(--text-primary);
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
  }

  h2 {
    text-align: center;
    margin-top: 2rem;
    font-size: 2rem;
    color: var(--primary-dark);
    animation: fadeInDown 0.8s ease forwards;
  }

  .product-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2rem;
    margin: 2rem auto;
    padding: 0 1rem;
    max-width: 1200px;
    animation: fadeInUp 1s ease forwards;
  }

  .product-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 8px 16px rgba(47, 77, 47, 0.15);
    padding: 1.5rem;
    text-align: center;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .product-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 12px 24px rgba(47, 77, 47, 0.3);
  }

  .product-card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    margin-bottom: 1rem;
    border-radius: 12px;
    background-color: var(--background);
    padding: 0.5rem;
    transition: all 0.3s ease;
  }

  .product-card h3 {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    color: var(--text-secondary);
  }

  .product-card p {
    font-size: 1rem;
    color: var(--primary);
    margin-bottom: 1.2rem;
  }

  .product-card a {
    display: inline-block;
    padding: 0.6rem 1.2rem;
    background: var(--btn-bg);
    color: #fff;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.95rem;
    transition: background 0.3s ease, transform 0.3s ease;
  }

  .product-card a:hover {
    background: var(--btn-hover);
    transform: scale(1.05);
  }

  /* Animations */
  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Mobile tweaks */
  @media (max-width: 480px) {
    .product-card img {
      height: 150px;
    }
    .product-card h3 {
      font-size: 1rem;
    }
    .product-card p {
      font-size: 0.9rem;
    }
    .product-card a {
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
    }
  }
</style>

<h2>Recommended Products for You</h2>

<div class="product-list">
  {% for product in products %}
    <div class="product-card">
      <img src="{{ product.thumbnail }}" alt="{{ product.title }}">
      <h3>{{ product.title }}</h3>
      <p>{{ product.price }}</p>
      <a href="{{ product.link }}" target="_blank">View Product</a>
    </div>
  {% endfor %}
</div>
